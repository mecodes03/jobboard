[project]
name = "py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harsh", email = "harshvaish2003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jobspy-py",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
py = "py:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
jobspy-py = { path = "../jobspy-py", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
