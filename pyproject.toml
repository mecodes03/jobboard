[project]
name = "jobboard"
version = "0.1.0"
description = "Job Board"
readme = "README.md"
authors = [{ name = "harsh", email = "harshvaish2003@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "apify>=4.2.1",
    "jobspy-py",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
jobboard = "jobboard:main"
jobboard-api = "jobboard.serve:main"
jobboard-actor = "jobboard.actor:run"

[project.optional-dependencies]
api = ["fastapi>=0.163.1", "uvicorn[standard]>=0.54.0"]
apify = ["apify>=4.2.1"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
jobspy-py = { path = "../jobspy-py", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["anyio>=4.16.0", "httpx>=0.28.1", "pyright>=1.1.414", "pytest>=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
